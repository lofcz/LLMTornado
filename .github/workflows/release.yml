name: Create Release and Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      existing_tag:
        description: 'Retry publishing the assets of an existing release (for example v3.8.82)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  retry-publish:
    if: inputs.existing_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.existing_tag }}
    steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100'
    - name: Download existing release packages
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        gh release download "$RELEASE_TAG" --pattern 'LlmTornado*.nupkg' --dir ./nupkgs
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "./nupkgs/LlmTornado*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY" --skip-duplicate

  build-and-release:
    if: inputs.existing_tag == ''
    runs-on: ubuntu-latest
    
    steps:
    # Checkout repository with full history
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}
    
    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100'

    # Setup NodeJS
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install NPM dependencies for Docs project
      run: npm ci
      working-directory: ./src/LlmTornado.Docs

    # Check which projects changed and calculate their new versions
    - name: Check Changes and Calculate Versions
      id: version_check
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
      run: |
        SHOULD_RELEASE="false"
        CHANGED_PROJECTS=""
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        NEW_VERSION=""
        
        # Function to compare version numbers
        version_gt() {
          test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
        }
        
        # Check each project for changes and update versions
        for proj in $(find ./src -name "*.csproj" ! -path "./src/LlmTornado.Docs/*" ! -path "./src/fork_blazor_workers/*"); do
          PROJECT_NAME=$(basename "$proj")
          PROJECT_DIR=$(dirname "$proj")
          
          # Get current version from csproj
          CURRENT_VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' "$proj" || true)
          
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Warning: Could not find version in $proj"
            continue
          fi
          
          # Split version into parts
          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          # Check if project has changes since last tag
          if [ -z "$LATEST_TAG" ] || ! git diff --quiet "$LATEST_TAG" HEAD -- "$PROJECT_DIR"; then
            # Calculate new version based on release type
            case "$RELEASE_TYPE" in
              "major")
                PROJECT_NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              "minor")
                PROJECT_NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              "patch")
                PROJECT_NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
            
            # Update version in csproj
            sed -i "s/<Version>.*<\/Version>/<Version>${PROJECT_NEW_VERSION}<\/Version>/g" "$proj"
            
            CHANGED_PROJECTS="$CHANGED_PROJECTS$PROJECT_NAME -> $PROJECT_NEW_VERSION\n"
            SHOULD_RELEASE="true"
            
            # Update NEW_VERSION if this project's version is higher
            if [ -z "$NEW_VERSION" ] || version_gt "$PROJECT_NEW_VERSION" "$NEW_VERSION"; then
              NEW_VERSION="$PROJECT_NEW_VERSION"
              echo "New highest version: $NEW_VERSION from $PROJECT_NAME"
            fi
          fi
        done
        
        if [ -z "$NEW_VERSION" ]; then
          echo "No version changes detected"
          exit 0
        fi
        
        echo "Final highest version will be: v$NEW_VERSION"
        
        # Set environment variables for next steps
        echo "CHANGED_PROJECTS<<EOF" >> "$GITHUB_ENV"
        echo -e "$CHANGED_PROJECTS" >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"
        echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> "$GITHUB_ENV"
        echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

    # Generate release notes with commits and changed projects
    - name: Generate Release Notes
      if: env.SHOULD_RELEASE == 'true'
      id: release_notes
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$PREVIOUS_TAG" ]; then
          COMMITS=$(git log --pretty=format:"- %s" --no-merges)
        else
          COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
        fi
        {
          echo "## What's Changed"
          echo "$COMMITS"
          echo -e "\n## Updated Projects"
          echo "$CHANGED_PROJECTS"
        } > "$RUNNER_TEMP/release-notes.md"
    
    # Restore project dependencies
    - name: Restore dependencies
      if: env.SHOULD_RELEASE == 'true'
      run: dotnet restore LlmTornado.slnx
      working-directory: ./src
      
    # Build solution
    - name: Build
      if: env.SHOULD_RELEASE == 'true'
      run: dotnet build LlmTornado.slnx --configuration Release --no-restore -p:SkipViteBuild=true
      working-directory: ./src
      
    # Create NuGet packages
    - name: Pack
      if: env.SHOULD_RELEASE == 'true'
      run: dotnet pack LlmTornado.slnx --configuration Release --no-build --output ../nupkgs
      working-directory: ./src
    
    # Persist versions before creating the release or publishing packages.
    - name: Commit version updates
      if: env.SHOULD_RELEASE == 'true' && env.NEW_VERSION != ''
      env:
        RELEASE_BRANCH: ${{ github.ref_name }}
      run: |
        echo "Creating release for version v$NEW_VERSION"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -- 'src/**/*.csproj'
        git commit -m "Update project versions to v$NEW_VERSION"
        git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
        git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$NEW_VERSION"

    - name: Create Release and Upload Assets
      if: env.SHOULD_RELEASE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v$NEW_VERSION" ./nupkgs/LlmTornado*.nupkg \
          --verify-tag --title "Release v$NEW_VERSION" \
          --notes-file "$RUNNER_TEMP/release-notes.md"

    - name: Push to NuGet
      if: env.SHOULD_RELEASE == 'true'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "./nupkgs/LlmTornado*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY" --skip-duplicate
